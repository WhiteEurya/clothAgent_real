[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "cloth-agent"
version = "0.1.0"
description = "Safety-gated minimal xArm Agent experimentation loop"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "boto3>=1.34",
  "numpy>=1.24",
  "tomli>=2; python_version < '3.11'",
  "Pillow>=9",
  "PyYAML>=6",
  "scipy>=1.10",
  "yourdfpy>=0.0.56",
  "python-fcl==0.7.0.11",
]

[project.optional-dependencies]
legacy-viewer = ["viser>=1.0,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloth_agent*"]
exclude = [
    "data*",
    "assets*",
    "config*",
    "reports*",
    "artifacts*",
    "tests*",
]

[tool.setuptools.package-data]
"cloth_agent" = ["residual_review.html"]
"cloth_agent.experiments" = ["replay_live_graph.html"]
