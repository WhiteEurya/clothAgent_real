[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "cloth-agent"
version = "0.1.0"
description = "Safety-gated minimal xArm Agent experimentation loop"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9",
  "PyYAML>=6",
  "scipy>=1.10",
  "viser>=1.0,<2",
  "yourdfpy>=0.0.56",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
