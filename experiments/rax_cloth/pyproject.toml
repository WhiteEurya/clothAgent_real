[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "rax-cloth"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9", "scipy>=1.10", "Jinja2>=3.1", "tomli; python_version < '3.11'"]
[project.scripts]
rax-cloth = "rax_cloth.cli:main"
[tool.setuptools.packages.find]
include = ["rax_cloth*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.package-data]
rax_cloth = ["upstream.json", "upstream_reference/*", "agent_assets/*.py"]
