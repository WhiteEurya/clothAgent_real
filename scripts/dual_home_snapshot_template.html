<!doctype html><html lang="zh"><meta charset="utf-8"><title>双臂 Home 路径 · 只读预览</title>
<style>body{background:#101925;color:#eef4ff;font:16px system-ui;margin:24px}h1{margin-bottom:10px}.warn{background:#422b1a;padding:16px;border-radius:8px;line-height:1.65}button,select{padding:9px;margin:8px;background:#263a51;color:white;border:1px solid #72869c;border-radius:5px}input{width:45%}canvas{width:100%;height:65vh;background:#182638;border-radius:10px}.legend{color:#9ab7d4}#info{font-size:18px;margin:12px}table{border-collapse:collapse;width:100%;margin:18px 0}td,th{border-bottom:1px solid #41536a;padding:9px;text-align:left}</style>
<h1>双臂当前位置与 Home 路径</h1><p class="legend">arm6 蓝色 · arm7 橙色 ｜ world = arm6 base ｜ 底座间距 450 mm ｜ 单位 mm</p>
<div id="warnings" class="warn"></div><table><thead><tr><th>候选路径</th><th>最小采样包络间距</th><th>几何诊断（不是执行许可）</th></tr></thead><tbody id="summary"></tbody></table>
<select id="route"></select><button id="play">播放 / 暂停</button><button id="current">当前位置</button><button id="home">Home</button><input type="range" min="0" value="0" id="slider">
<div><button id="oblique">斜视</button><button id="top">俯视 X/Y</button><button id="front">正视 X/Z</button><span class="legend">拖动旋转，滚轮缩放。线条表示胶囊体包络，不是实拍或精细外壳。</span></div><div id="info"></div><canvas id="scene"></canvas>
<script>
const data=__DATA__;const $=s=>document.getElementById(s);$('warnings').textContent=data.warnings.join(' ');
for(const [name,s] of Object.entries(data.summary)){let o=document.createElement('option');o.textContent=name;$('route').appendChild(o);let row=document.createElement('tr');for(const v of [name,s.minimum_sampled_capsule_clearance_mm.toFixed(1)+' mm',s.status==='MODEL_CLEARANCE_VIOLATION'?'模型净空不足；禁止作为执行路径':'仅采样未发现净空不足；未经连续安全验证']){let c=document.createElement('td');c.textContent=v;row.appendChild(c)}$('summary').appendChild(row)}
const canvas=$('scene'),ctx=canvas.getContext('2d');let yaw=-.65,elev=.65,zoom=1,playing=false,drag=null;
function rotate(p){let x=p[0]-225,y=p[1],z=p[2]-350;return [Math.cos(yaw)*x-Math.sin(yaw)*y, -Math.sin(elev)*(Math.sin(yaw)*x+Math.cos(yaw)*y)+Math.cos(elev)*z,Math.cos(elev)*(Math.sin(yaw)*x+Math.cos(yaw)*y)+Math.sin(elev)*z]}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);let scale=Math.min(w/1400,h/1100)*zoom;let project=p=>{let q=rotate(p);return [w/2+q[0]*scale,h/2-q[1]*scale]};let line=(a,b,color,width)=>{let x=project(a),y=project(b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...x);ctx.lineTo(...y);ctx.stroke()};ctx.clearRect(0,0,w,h);
for(let x=-500;x<=1000;x+=100)line([x,-500,0],[x,500,0],'#314358',1);for(let y=-500;y<=500;y+=100)line([-500,y,0],[1000,y,0],'#314358',1);
for(const [base,dx,dy,label] of [[[0,0,0],1,1,'arm6 base'],[[450,0,0],-1,-1,'arm7 base']]){let p=project(base);ctx.fillStyle='white';ctx.fillText(label,p[0]+5,p[1]+15);line(base,[base[0]+100*dx,0,0],'#e56060',3);line(base,[base[0],100*dy,0],'#6bdd7e',3);line(base,[base[0],0,100],'#ac9fff',3)}
const frames=data.routes[$('route').value];$('slider').max=frames.length-1;let i=Math.min(+$('slider').value,frames.length-1),f=frames[i];let parts=[];for(const [k,a] of Object.entries(f.arms))for(const c of a.capsules)parts.push({k,c,depth:(rotate(c.a)[2]+rotate(c.b)[2])/2});parts.sort((a,b)=>a.depth-b.depth);
for(const {k,c} of parts){let color=k==='left'?'#4eacff':'#ffa34d';line(c.a,c.b,color+'88',Math.max(2,2*c.r*scale));line(c.a,c.b,color,2)}
for(const [k,a] of Object.entries(f.arms)){let p=project(a.tcp);ctx.fillStyle='white';ctx.beginPath();ctx.arc(...p,4,0,2*Math.PI);ctx.fill();ctx.fillText((k==='left'?'arm6':'arm7')+' TCP',p[0]+8,p[1]);}
$('info').textContent=`${$('route').value} · 进度 ${(i/(frames.length-1)*100).toFixed(0)}% · 模型包络间距 ${f.clearance_mm.toFixed(1)} mm · 最近 ${f.closest_pair.join(' / ')}（负值表示包络重叠）`;}
$('route').onchange=()=>{$('slider').value=0;draw()};$('slider').oninput=draw;$('current').onclick=()=>{playing=false;$('slider').value=0;draw()};$('home').onclick=()=>{playing=false;$('slider').value=data.routes[$('route').value].length-1;draw()};$('play').onclick=()=>playing=!playing;
$('top').onclick=()=>{yaw=0;elev=Math.PI/2;draw()};$('front').onclick=()=>{yaw=0;elev=0;draw()};$('oblique').onclick=()=>{yaw=-.65;elev=.65;draw()};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.005;elev=Math.max(-1.5,Math.min(1.57,elev+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];draw()}};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw()};window.onresize=draw;setInterval(()=>{if(playing){$('slider').value=(+$('slider').value+1)%data.routes[$('route').value].length;draw()}},100);draw();
</script></html>
